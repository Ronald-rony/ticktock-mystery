<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TickTock Mystery — Kid-Friendly Analog Clock Game</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(180deg, #E8F9FF 0%, #FFF9ED 100%);
        color: #1E293B;
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      main {
        max-width: 540px;
        width: 100%;
        background: #FFFFFF;
        border-radius: 28px;
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.09);
      }
      h1 { margin: 0 0 8px; font-size: 32px; }
      .t1 { color: #FF5A5F; }
      .t2 { color: #29B6F6; }
      .t3 { color: #9B5DE5; }
      p { color: #475569; line-height: 1.6; font-weight: 600; }
      a.btn {
        display: inline-block;
        margin-top: 16px;
        background: #58CC02;
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 800;
        padding: 12px 24px;
        border-radius: 16px;
        box-shadow: 0 4px 0 #3E9400;
      }
      .pill {
        display: inline-block;
        background: #DCFCE7;
        color: #166534;
        font-weight: 700;
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 999px;
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="pill">100% Kid-Safe • No Ads • Offline</span>
      <h1><span class="t1">Tick</span><span class="t2">Tock</span> <span class="t3">Mystery</span></h1>
      <p>
        A joyful, colorful analog clock guessing game for kids! Guess the secret time with
        Pip the Owl, watch the hidden numbers pop onto the dial, and collect stars, badges,
        and toy clock skins.
      </p>
      <a class="btn" href="./privacy-policy.html">Read Kid-Safe Privacy Policy</a>
    </main>
  </body>
</html>
